[project]
name = "backend-manufacturing-erp-flask"
version = "0.1.0"
description = "Manufacturing ERP Backend using Flask"
readme = "README.md"
authors = [
    { name = "erfiaaans", email = "erfianadia05@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "flask-jwt-extended>=4.7.4",
    "flask-migrate>=4.1.0",
    "flask-sqlalchemy>=3.1.1",
    "marshmallow>=4.3.1",
    "marshmallow-sqlalchemy>=1.5.0",
    "psycopg2-binary>=2.9.12",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.3",
]

[project.scripts]
backend-manufacturing-erp-flask = "backend_manufacturing_erp_flask:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
